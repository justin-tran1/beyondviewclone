      <rect x="48.35" y="3.8" width="0.35" height="1.8"/>
      <rect x="6" y="22.5" width="6" height="2.5"/>
      <rect x="8.1" y="20.4" width="1.8" height="0.35"/>
      <rect x="8.1" y="20.75" width="1.8" height="1.45"/>
