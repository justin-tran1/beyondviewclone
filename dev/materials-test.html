<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Material board</title>
  <script type="importmap">
    {
      "imports": {
        "three": "../assets/vendor/three/three.module.min.js",
        "three/addons/": "../assets/vendor/three/addons/",
        "three/examples/jsm/": "../assets/vendor/three/addons/"
      }
    }
  </script>
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      display: flex; flex-direction: column; background: #f6f6f6; color: #435254;
      font: 14px/1.4 Calibre, "Segoe UI", system-ui, sans-serif;
    }
    header {
      display: flex; align-items: center; gap: 16px; padding: 0 16px; height: 44px; flex: none;
      background: #003f2d; color: #fff;
    }
    header strong { font: 600 16px/1 "Financier Display", Georgia, serif; letter-spacing: 0.01em; white-space: nowrap; }
    nav { display: flex; gap: 4px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
    nav a { color: #cad1d3; text-decoration: none; padding: 4px 8px; border-radius: 4px; white-space: nowrap; }
    nav a:hover { color: #fff; background: #012a2d; }
    nav a[aria-current] { color: #fff; box-shadow: inset 0 -2px 0 #17e88f; }
    #stats { margin-left: auto; color: #cad1d3; font-variant-numeric: tabular-nums; white-space: nowrap; }
    #stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }
    #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #labels { position: absolute; inset: 0; pointer-events: none; }
    .label {
      position: absolute; transform: translate(-50%, 0); padding: 2px 6px; border-radius: 3px;
      background: rgba(255, 255, 255, 0.82); color: #435254; font-size: 12px; line-height: 16px; white-space: nowrap;
    }
    .label small { display: block; color: #7f8480; font-size: 11px; line-height: 13px; }
    .compact .label small { display: none; }
    .section {
      position: absolute; transform: translate(-100%, -50%); color: #012a2d; font: 600 15px/1.2 "Financier Display", Georgia, serif;
      white-space: nowrap; text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6);
    }
    #err { position: fixed; left: 16px; bottom: 16px; max-width: 70%; color: #8a1f1f; background: #fff; white-space: pre-wrap; }
    #err:empty { display: none; }
  </style>
</head>
<body>
  <header>
    <strong>Material board</strong>
    <nav id="views"></nav>
    <span id="stats"></span>
  </header>
  <div id="stage">
    <canvas id="c" aria-label="Material swatches. Drag to orbit, scroll to zoom."></canvas>
    <div id="labels"></div>
  </div>
  <div id="err"></div>
  <script type="module" src="materials-test.js"></script>
</body>
</html>
