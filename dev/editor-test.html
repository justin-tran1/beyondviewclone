<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plan editor test</title>
  <script type="importmap">
    { "imports": { "three": "../assets/vendor/three/three.module.min.js", "three/addons/": "../assets/vendor/three/addons/" } }
  </script>
  <style>
    :root {
      --green: #003f2d; --dark: #012a2d; --accent: #17e88f; --text: #435254; --line: #c7c8ca; --tint: #f6f6f6;
      font-family: Calibre, "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    }
    html, body { margin: 0; height: 100%; overflow: hidden; color: var(--text); background: #fbfbfb; }
    #plan { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
    .bar {
      position: fixed; left: 12px; top: 12px; display: flex; gap: 4px; flex-wrap: wrap; align-items: center;
      padding: 6px; background: #fff; border: 1px solid var(--line); border-radius: 6px;
      box-shadow: 0 2px 10px rgba(1, 42, 45, 0.08); max-width: calc(100% - 24px); box-sizing: border-box;
    }
    .bar button, .bar select {
      font: 600 13px/1 inherit; font-family: inherit; color: var(--text); background: #fff; border: 1px solid transparent;
      border-radius: 4px; padding: 7px 10px; cursor: pointer;
    }
    .bar button:hover { background: var(--tint); }
    .bar button[aria-pressed="true"] { background: var(--green); color: #fff; }
    .bar select { border-color: var(--line); }
    .bar .sep { width: 1px; align-self: stretch; background: var(--line); margin: 2px 4px; }
    .status {
      position: fixed; left: 12px; bottom: 12px; right: 12px; display: flex; justify-content: space-between; gap: 16px;
      font-size: 13px; pointer-events: none;
    }
    .status span { background: rgba(255, 255, 255, 0.92); border: 1px solid var(--line); border-radius: 4px; padding: 5px 9px; }
    body.bare .bar, body.bare .status { display: none; }
  </style>
</head>
<body>
  <canvas id="plan" aria-label="Floor plan editor"></canvas>
  <div class="bar" id="bar">
    <button data-tool="select">Select</button>
    <button data-tool="pan">Pan</button>
    <span class="sep"></span>
    <button data-tool="wall">Wall</button>
    <select id="kind" aria-label="Wall type">
      <option value="interior">Interior</option>
      <option value="exterior">Exterior</option>
      <option value="glass">Glass</option>
      <option value="partial">Half height</option>
    </select>
    <button data-tool="room">Room</button>
    <span class="sep"></span>
    <button data-tool="door">Door</button>
    <button data-tool="double-door">Double door</button>
    <button data-tool="sliding-door">Sliding door</button>
    <button data-tool="opening">Opening</button>
    <button data-tool="window">Window</button>
    <span class="sep"></span>
    <select id="item" aria-label="Item to place"></select>
    <button data-tool="camera">View</button>
    <button data-tool="calibrate">Calibrate</button>
    <span class="sep"></span>
    <button id="dims">Dimensions</button>
    <button id="units">Metric</button>
    <button id="fit">Fit</button>
  </div>
  <div class="status"><span id="status">Loading</span><span id="cursor"></span></div>
  <script type="module" src="editor-test.js"></script>
</body>
</html>
