    <g text-anchor="middle" font-size="0.62">
      <text x="10" y="-3.45">20'-0"</text>
      <text x="26" y="-3.45">12'-0"</text>
      <text x="38" y="-3.45">12'-0"</text>
      <text x="52" y="-3.45">16'-0"</text>
      <text x="30" y="-5.95">60'-0"</text>
      <text transform="translate(-3.75 20) rotate(-90)">40'-0"</text>
