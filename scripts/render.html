<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Render harness</title>
  <script type="importmap">
    {
      "imports": {
        "three": "../assets/vendor/three/three.module.min.js",
        "three/addons/": "../assets/vendor/three/addons/"
      }
    }
  </script>
  <style>html, body { margin: 0; background: #222; } canvas { display: block; }</style>
</head>
<body>
  <canvas id="c"></canvas>
  <script type="module">
    import { createLab } from '../assets/js/lab-scene.js';

    const lab = createLab({ canvas: document.getElementById('c'), preserveDrawingBuffer: true, shadowSize: 4096 });

    // Called by scripts/render.mjs for each image it needs.
    window.renderShot = ({ mode, view, width, height, fov = 62, quality = 0.86 }) => {
      lab.setMode(mode);
      lab.resize(width, height, 1);
      lab.setView(view, fov);
      lab.render();
      return lab.renderer.domElement.toDataURL('image/jpeg', quality);
    };
    window.ready = true;
  </script>
</body>
</html>
