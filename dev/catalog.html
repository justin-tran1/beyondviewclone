<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catalog Preview</title>
  <script type="importmap">
    {
      "imports": {
        "three": "../assets/vendor/three/three.module.min.js",
        "three/addons/": "../assets/vendor/three/addons/",
        "three/examples/jsm/": "../assets/vendor/three/addons/",
        "three-mesh-bvh": "../assets/vendor/three-mesh-bvh/index.module.js",
        "three-gpu-pathtracer": "../assets/vendor/three-gpu-pathtracer/index.module.js"
      }
    }
  </script>
  <style>
    body { margin: 0; font: 14px/1.4 system-ui, sans-serif; color: #435254; background: #f6f6f6; }
    header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; padding: 12px 16px; background: #003f2d; color: #fff; }
    header h1 { margin: 0; font-size: 16px; font-weight: 600; }
    header nav { display: flex; flex-wrap: wrap; gap: 4px 12px; }
    header a { color: #fff; }
    header a[aria-current] { font-weight: 600; text-decoration-color: #17e88f; text-decoration-thickness: 2px; }
    header code { color: #cad1d3; font-size: 12px; }
    #wrap { position: relative; }
    #stage { width: 100%; height: max(480px, 68vh); display: block; background: #e9eef1; }
    #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    #labels a, #labels span { position: absolute; transform: translateX(-50%); padding: 1px 5px; border-radius: 3px; background: rgb(255 255 255 / 0.82);
      color: #435254; font-size: 11px; white-space: nowrap; text-decoration: none; pointer-events: auto; }
    #labels a:hover { background: #fff; text-decoration: underline; }
    #labels span.view { transform: none; font-size: 12px; font-weight: 600; }
    #report { padding: 8px 16px; background: #fff; border-top: 1px solid #c7c8ca; white-space: pre-wrap; font: 12px/1.5 ui-monospace, monospace; }
    #report:empty { display: none; }
    #plan { width: 100%; display: block; background: #fff; border-top: 1px solid #c7c8ca; }
    #err { color: #ad2a2a; padding: 8px 16px; white-space: pre-wrap; }
    #err:empty { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>Catalog preview</h1>
    <nav id="nav"></nav>
    <code>?category=lab|medical|office|retail|general&amp;view=front|top|room, or ?item=&lt;type&gt;&amp;w=&amp;d=&amp;h=&amp;color=&amp;view=room&amp;yaw=</code>
  </header>
  <div id="err"></div>
  <div id="wrap"><canvas id="stage"></canvas><div id="labels"></div></div>
  <div id="report"></div>
  <canvas id="plan"></canvas>
  <script type="module" src="catalog.js"></script>
</body>
</html>
