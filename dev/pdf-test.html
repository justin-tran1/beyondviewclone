<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF Scan Test</title>
  <script type="importmap">
    { "imports": { "pdfjs-dist": "../assets/vendor/pdfjs/pdf.min.mjs" } }
  </script>
  <style>
    body { margin: 0; font: 14px/1.4 system-ui, sans-serif; color: #435254; background: #f6f6f6; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 12px 16px; background: #003f2d; color: #fff; }
    header h1 { margin: 0; font-size: 16px; font-weight: 600; }
    #pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 16px; padding: 16px; }
    figure { margin: 0; background: #fff; padding: 8px; border-radius: 6px; box-shadow: 0 1px 2px rgb(0 0 0 / 0.08); }
    .frame { position: relative; }
    .frame canvas { display: block; width: 100%; height: auto; }
    .area { position: absolute; border: 2px solid #17a673; background: rgb(23 166 115 / 0.08); }
    figcaption { margin-top: 6px; font-size: 12px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <header><h1>PDF scan test</h1><input type="file" id="file" accept=".pdf,application/pdf"><span id="state"></span></header>
  <main id="pages"></main>
  <script type="module" src="pdf-test.js"></script>
</body>
</html>
